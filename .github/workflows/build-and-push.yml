name: Build and push frontend image

# 这个仓库是 Gitee 镜像过来的(源头是 gitee.com/joeyzhoucd/mall-admin-front.git),
# 目前只手动同步,还没接 hub-mirror-action 自动镜像 —— 靠 push 到 master 触发
# (手动同步一次代码就会自动触发一次构建),也保留 workflow_dispatch 方便手动点一下重新跑。
on:
  push:
    branches: [master]
  workflow_dispatch: {}

# packages: write 是推镜像到 ghcr.io 必须的权限;GITHUB_TOKEN 是仓库自带的,
# 不用额外去生成 PAT、不用存 secret。
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mall-admin-front
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mall-admin-front:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/mall-admin-front:latest
          cache-from: type=gha,scope=mall-admin-front
          cache-to: type=gha,mode=max,scope=mall-admin-front
