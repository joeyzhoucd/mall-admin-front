name: Build and push frontend image

# 这个仓库是 Gitee 镜像过来的(源头是 gitee.com/joeyzhoucd/mall-admin-front.git),
# 目前只手动同步,还没接 hub-mirror-action 自动镜像 —— 靠 push 到 master 触发
# (手动同步一次代码就会自动触发一次构建),也保留 workflow_dispatch 方便手动点一下重新跑。
on:
  push:
    branches: [master]
    # 纯文档改动不触发构建。
    #
    # 【判定规则】看的是「本次推送改动的文件是否【全部】命中忽略列表」——
    # 一次提交同时改了文档和代码，照样正常构建，不会被跳过。
    #
    # 【为什么值得加】没有它的时候，改一行 README 会引发：
    # 24 分钟全量构建（含集成测试）+ update-deploy 把镜像 tag 改成新 commit
    # + ArgoCD 同步 + 12 个服务全部滚动重启。为一次文档改动做这一整套毫无意义。
    #
    # 【刻意不忽略 .github/**】workflow 自己改了必须能触发一次构建来验证它，
    # 否则改坏了要等到下次真实推送才发现。
    #
    # 【将来的坑，先记下来】如果以后给 master 加分支保护、把这个 workflow 设成
    # 必需的状态检查，paths-ignore 会让纯文档的 PR 永远等不到这个检查、卡住无法合并。
    # 那时不能靠 paths-ignore，要改成「workflow 总是运行、但用 job 级 if: 条件跳过实际步骤」。
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitattributes'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch: {}

# packages: write 是推镜像到 ghcr.io 必须的权限;GITHUB_TOKEN 是仓库自带的,
# 不用额外去生成 PAT、不用存 secret。
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mall-admin-front
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mall-admin-front:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/mall-admin-front:latest
          cache-from: type=gha,scope=mall-admin-front
          cache-to: type=gha,mode=max,scope=mall-admin-front

  # mall-deploy 只在 Gitee 上，这个仓库的 CI 跑在 GitHub 上，两边够不着，
  # 所以用 GITEE_TOKEN 直接 git clone/push，不走 actions/checkout（它只认 GitHub 仓库）。
  update-deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Clone mall-deploy from Gitee
        run: git clone https://joeyzhoucd:${{ secrets.GITEE_TOKEN }}@gitee.com/joeyzhoucd/mall-deploy.git mall-deploy

      - name: Bump frontend image tag
        run: yq e '.frontend.tag = "${{ github.sha }}"' -i mall-deploy/charts/mall/values.yaml

      - name: Commit and push
        run: |
          cd mall-deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "tag 没变化，跳过提交"
            exit 0
          fi
          git add charts/mall/values.yaml
          git commit -m "chore: 前端镜像自动更新到 ${{ github.sha }}"
          git push
