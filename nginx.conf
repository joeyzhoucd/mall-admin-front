server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 显式声明 utf-8。不声明的话响应头只有 `Content-Type: text/html`，
    # 浏览器会退回去看 HTML 里的 <meta charset>；两个应用目前都有那个标签，
    # 所以现在是好的 —— 但那意味着「有没有乱码」取决于一个容易被删掉的标签。
    # 这个项目在编码上已经反复吃过亏（种子数据双重编码、kubectl exec stdin 搞乱中文），
    # 在响应头上说清楚更省事。
    charset utf-8;

    # 交给网关：mall-gateway 自己的路由规则要求原样看到 /api 前缀
    # （它自己的 RewritePath 过滤器会在转发给具体后端服务前把 /api 去掉）。
    location /api/ {
        proxy_pass http://mall-gateway:88;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 新的 React 后台（重写中）。必须放在 location / 之【前】声明，
    # 而且回退目标是 /next/index.html 而不是 /index.html ——
    # 回退错了会在 /next/ 下加载出旧 Vue 应用的 index.html，
    # 表现是「地址是新的、页面是旧的」，很容易误判成缓存问题。
    location /next/ {
        try_files $uri $uri/ /next/index.html;
    }

    # 单页应用：非静态文件请求一律回退到 index.html，交给前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }
}
