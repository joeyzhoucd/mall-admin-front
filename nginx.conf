server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 交给网关：mall-gateway 自己的路由规则要求原样看到 /api 前缀
    # （它自己的 RewritePath 过滤器会在转发给具体后端服务前把 /api 去掉）。
    location /api/ {
        proxy_pass http://mall-gateway:88;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 单页应用：非静态文件请求一律回退到 index.html，交给前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }
}
