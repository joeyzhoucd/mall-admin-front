server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 显式声明 utf-8。不声明的话响应头只有 `Content-Type: text/html`，
    # 浏览器会退回去看 HTML 里的 <meta charset>；admin/index.html 目前有那个标签，
    # 所以现在是好的 —— 但那意味着「有没有乱码」取决于一个容易被删掉的标签。
    # 这个项目在编码上已经反复吃过亏（种子数据双重编码、kubectl exec stdin 搞乱中文），
    # 在响应头上说清楚更省事。
    charset utf-8;

    # 交给网关：mall-gateway 自己的路由规则要求原样看到 /api 前缀
    # （它自己的 RewritePath 过滤器会在转发给具体后端服务前把 /api 去掉）。
    location /api/ {
        proxy_pass http://mall-gateway:88;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2026-09-11：React 后台从 /next/ 挪到了 / （旧 Vue 应用已删除）。
    #
    # 【为什么保留这一段而不是直接删掉】/next/ 这个地址用了几周，
    # 浏览器书签和聊天记录里都有。删掉的话那些链接会落到下面的
    # SPA 回退，返回 200 + React 的 index.html —— 而 hash 路由会把
    # #/... 之后的部分当路由，结果是「页面打开了但内容不对」，
    # 看起来像应用坏了，而不是「这个地址搬走了」。
    #
    # 301 让浏览器把跳转记下来，旧书签会被自动更新。
    # 注意末尾的 $1：/next/#/product-brand 这种带 hash 的不会进到这里
    # （hash 不发给服务器），但 /next/config/index.js 这类真实路径会，
    # 保留后半段才能转到对应的新位置。
    location ~ ^/next/(.*)$ {
        return 301 /$1;
    }
    location = /next {
        return 301 /;
    }

    # 【构建产物目录不参与 SPA 回退】
    #
    # 下面那条 `try_files $uri $uri/ /index.html` 会让【任何】不存在的路径
    # 返回 200 + index.html。对路由来说这是对的（hash 路由要的就是这个），
    # 但对资源文件来说是有害的：
    # 缺一个 /assets/index-xxx.js 时浏览器拿到的是 HTML，
    # 按 JS 解析后报 `Unexpected token '<'` —— 白屏，而错误信息
    # 完全不指向真实原因（"文件不在"）。config/index.js 缺失同理，
    # 那会让 window.SITE_CONFIG 是 undefined，表现成登录请求打到错误的地址。
    #
    # 这次切换时就踩到了它的另一面：我拿 `/static/config/index.js` 返回 404
    # 当作"旧 Vue 应用已删除"的负控，而它返回 200（回退的 index.html）——
    # 那个负控因此完全无效，只能进镜像 ls 才确认了旧应用真的没了。
    # 让资源路径老实地 404，状态码才重新有判别力。
    location ~ ^/(assets|config)/ {
        try_files $uri =404;
    }

    # 单页应用：非静态文件请求一律回退到 index.html，交给前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }
}
